# Backend + frontend con reverse proxy nginx
# El frontend expone el puerto 80 publicamente y proxea /api/* al backend.
# Cloudflare apunta el subdominio a la IP de la EC2 -> puerto 80.

services:
  backend:
    build: ./backend
    container_name: healthai-backend
    restart: unless-stopped
    expose:
      - "8000"
    environment:
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - KINESIS_STREAM=${KINESIS_STREAM:-}
      - S3_BUCKET=${S3_BUCKET:-}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}

  frontend:
    build:
      context: ./frontend
    container_name: healthai-frontend
    restart: unless-stopped
    expose:
      - "80"
    depends_on:
      - backend

  jupyter:
    # Solo desarrollo. NO desplegar.
    build: ./notebooks
    container_name: healthai-jupyter
    profiles: ["dev"]
    ports:
      - "8888:8888"
    working_dir: /project/notebooks
    volumes:
      - .:/project
